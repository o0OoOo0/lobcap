[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lobcap"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.10,<4",
  "websockets>=13,<17",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
web = ["streamlit>=1.40,<2", "plotly>=5,<7", "pandas>=2,<3"]

[project.scripts]
lobcap-backtest = "lobcap.backtest.runner:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
